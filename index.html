<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>AI + 中国古代建筑成就可视化</title>

  <!-- ECharts CDN（国内可用） -->
  <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text",
                   "Helvetica Neue", Arial, sans-serif;
    }

    body {
      background: #f5f5f7;
      color: #1d1d1f;
    }

    /* 顶部导航 */
    header {
      height: 64px;
      background: rgba(255,255,255,0.8);
      backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 32px;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    header h1 {
      font-size: 18px;
      font-weight: 600;
    }

    header span {
      font-size: 14px;
      color: #6e6e73;
    }

    /* 主区域 */
    main {
      padding: 40px;
      max-width: 1200px;
      margin: auto;
    }

    .card {
      background: #ffffff;
      border-radius: 18px;
      padding: 32px;
      margin-bottom: 32px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.06);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    /* Apple 风 hover */
    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 32px rgba(0,0,0,0.08);
    }

    .card h2 {
      font-size: 20px;
      margin-bottom: 12px;
    }

    .card p {
      color: #6e6e73;
      line-height: 1.6;
      margin-bottom: 20px;
    }

    /* 图表区域 */
    #chart {
      width: 100%;
      height: 400px;
    }

    footer {
      text-align: center;
      padding: 40px;
      color: #6e6e73;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <!-- 顶部 -->
  <header>
    <h1>AI × 中国古代建筑</h1>
    <span>信息可视化实验项目</span>
  </header>

  <!-- 主体 -->
  <main>

    <!-- 项目介绍 -->
    <div class="card">
      <h2>项目简介</h2>
      <p>
        本项目以中国古代建筑成就为研究对象，结合人工智能数据整理能力
        与信息可视化技术，探索不同时代建筑类型的演变规律，
        为文化遗产研究提供新的分析视角。
      </p>
    </div>

    <!-- 可视化区域 -->
    <div class="card">
      <h2>各朝代建筑类型分布</h2>
      <p>
        图表展示了不同历史时期代表性建筑类型的数量变化。
        AI 对原始文本资料进行结构化处理后，
        数据以可视化形式呈现。
      </p>

      <div id="chart"></div>
    </div>

  </main>

  <footer>
    中国大学生计算机大赛 · AI + 信息可视化
  </footer>

  <!-- JS -->
  <script>
    const chartDom = document.getElementById('chart');
    const myChart = echarts.init(chartDom);

    const option = {
      tooltip: {
        trigger: 'axis'
      },
      legend: {
        data: ['宫殿', '寺庙', '桥梁']
      },
      xAxis: {
        type: 'category',
        data: ['秦汉', '隋唐', '宋元', '明清']
      },
      yAxis: {
        type: 'value'
      },
      series: [
        {
          name: '宫殿',
          type: 'line',
          smooth: true,
          data: [12, 20, 18, 25]
        },
        {
          name: '寺庙',
          type: 'line',
          smooth: true,
          data: [8, 15, 22, 30]
        },
        {
          name: '桥梁',
          type: 'line',
          smooth: true,
          data: [5, 10, 16, 28]
        }
      ],
      animationDuration: 1200,
      animationEasing: 'cubicOut'
    };

    myChart.setOption(option);

    window.addEventListener('resize', () => {
      myChart.resize();
    });
  </script>

</body>
</html>
