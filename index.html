<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>中国古代建筑成就可视化</title>

  <!-- 国内可用 ECharts CDN -->
  <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont,
                   "SF Pro Text", "Helvetica Neue",
                   Arial, sans-serif;
    }

    body {
      background: #f5f5f7;
      color: #1d1d1f;
    }

    /* 顶部 */
    header {
      height: 64px;
      padding: 0 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255,255,255,0.85);
      backdrop-filter: blur(10px);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    header h1 {
      font-size: 18px;
      font-weight: 600;
    }

    header span {
      font-size: 14px;
      color: #6e6e73;
    }

    /* 主体布局 */
    main {
      display: flex;
      gap: 24px;
      padding: 32px;
      max-width: 1200px;
      margin: auto;
    }

    /* 左右卡片 */
    .card {
      background: #ffffff;
      border-radius: 18px;
      padding: 28px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.06);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 32px rgba(0,0,0,0.08);
    }

    .left {
      flex: 3;
    }

    .right {
      flex: 1.4;
    }

    h2 {
      font-size: 20px;
      margin-bottom: 12px;
    }

    p {
      color: #6e6e73;
      line-height: 1.6;
      margin-bottom: 16px;
    }

    /* 图表 */
    #chart {
      width: 100%;
      height: 420px;
    }

    /* ===== AI 卡片 Apple 风动画 ===== */
    .ai-box {
      opacity: 0;
      transform: translateY(12px);
      transition: all 0.45s ease;
    }

    .ai-box.active {
      opacity: 1;
      transform: translateY(0);
    }

    footer {
      text-align: center;
      padding: 32px;
      color: #6e6e73;
      font-size: 14px;
    }
  </style>
</head>

<body>

<header>
  <h1>🏯 中国古代建筑成就可视化</h1>
  <span>AI + 信息可视化系统 Demo</span>
</header>

<main>

  <!-- 左侧图表 -->
  <div class="card left">
    <h2>各朝代建筑数量分布（示意数据）</h2>
    <p>
      基于 AI 对历史建筑文本资料的结构化处理结果，
      不同朝代代表性建筑数量以可视化形式呈现。
    </p>
    <div id="chart"></div>
  </div>

  <!-- 右侧 AI 解读 -->
  <div class="card right">
    <div class="ai-box" id="ai-box">
      <h2>AI 分析解读</h2>
      <p id="ai-text">
        点击左侧图表中的朝代柱状条，
        查看 AI 对该时期建筑特征的分析。
      </p>
    </div>
  </div>

</main>

<footer>
  中国大学生计算机大赛 · AI + 信息可视化方向
</footer>

<script>
  const chartDom = document.getElementById('chart');
  const myChart = echarts.init(chartDom);

  const option = {
    tooltip: { trigger: 'axis' },
    xAxis: {
      type: 'category',
      data: ['唐', '宋', '元', '明', '清']
    },
    yAxis: { type: 'value' },
    series: [{
      type: 'bar',
      data: [120, 200, 150, 80, 70],
      itemStyle: {
        color: '#5b4cdb',
        borderRadius: [6, 6, 0, 0]
      }
    }],
    animationDuration: 1000,
    animationEasing: 'cubicOut'
  };

  myChart.setOption(option);

  // ===== 伪 AI 解读映射 =====
  const aiAnalysisMap = {
    '唐': '唐代建筑规模宏大，强调中轴对称与都城规划，体现盛世气象。',
    '宋': '宋代建筑数量显著上升，城市化与工艺技术成熟推动建筑发展。',
    '元': '元代建筑在中原形制基础上，融合了多民族文化与空间布局特点。',
    '明': '明代建筑制度化程度高，官式建筑规范对后世影响深远。',
    '清': '清代建筑在礼制表达与装饰艺术方面达到高峰。'
  };

  const aiText = document.getElementById('ai-text');
  const aiBox = document.getElementById('ai-box');

  // 点击柱子 → AI 解读变化 + 动画
  myChart.on('click', function (params) {
    aiText.innerText = aiAnalysisMap[params.name];
    aiBox.classList.remove('active');
    void aiBox.offsetWidth; // 强制重绘，确保动画生效
    aiBox.classList.add('active');
  });

  window.addEventListener('resize', () => {
    myChart.resize();
  });
</script>

</body>
</html>
