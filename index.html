<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>中国古代建筑 · AI 可视化分析</title>

  <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont,
                   "SF Pro Text", "Helvetica Neue",
                   Arial, sans-serif;
    }

    body {
      background: #f5f5f7;
      color: #1d1d1f;
    }

    header {
      height: 64px;
      padding: 0 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255,255,255,0.85);
      backdrop-filter: blur(10px);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    header h1 {
      font-size: 18px;
      font-weight: 600;
    }

    header span {
      font-size: 14px;
      color: #6e6e73;
    }

    main {
      display: flex;
      gap: 24px;
      padding: 32px;
      max-width: 1200px;
      margin: auto;
    }

    .card {
      background: #ffffff;
      border-radius: 18px;
      padding: 28px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.06);
    }

    .left {
      flex: 3;
    }

    .right {
      flex: 1.4;
    }

    h2 {
      font-size: 20px;
      margin-bottom: 12px;
    }

    p {
      color: #6e6e73;
      line-height: 1.6;
      margin-bottom: 16px;
    }

    #chart {
      width: 100%;
      height: 420px;
    }

    .ai-box {
      opacity: 0;
      transform: translateY(12px);
      transition: all 0.45s ease;
    }

    .ai-box.active {
      opacity: 1;
      transform: translateY(0);
    }

    footer {
      text-align: center;
      padding: 32px;
      color: #6e6e73;
      font-size: 14px;
    }
  </style>
</head>

<body>

<header>
  <h1>🏯 中国古代建筑 · AI 可视化分析</h1>
  <span>真实数据 × AI 生成 × 信息可视化</span>
</header>

<main>

  <div class="card left">
    <h2>各朝代代表性建筑样本数量</h2>
    <p>
      数据来自结构化历史建筑样本，结合 AI 对技术、艺术与保存状况的综合分析结果。
    </p>
    <div id="chart"></div>
  </div>

  <div class="card right">
    <div class="ai-box" id="ai-box">
      <h2>AI 朝代解读</h2>
      <p id="ai-text">
        点击左侧图表中的朝代柱状条，查看 AI 生成的建筑特征总结。
      </p>
    </div>
  </div>

</main>

<footer>
  中国大学生计算机大赛 · AI + 信息可视化方向
</footer>

<script>
  const chartDom = document.getElementById('chart');
  const myChart = echarts.init(chartDom);

  const aiText = document.getElementById('ai-text');
  const aiBox = document.getElementById('ai-box');

  fetch('./ai_dynasty_stats.json')
    .then(res => res.json())
    .then(data => {
      const dynasties = data.map(d => d.dynasty);
      const counts = data.map(d => d.count);

      const aiMap = {};
      data.forEach(d => {
        aiMap[d.dynasty] = d.ai_insight;
      });

      const option = {
        tooltip: { trigger: 'axis' },
        xAxis: {
          type: 'category',
          data: dynasties
        },
        yAxis: { type: 'value' },
        series: [{
          type: 'bar',
          data: counts,
          itemStyle: {
            color: '#5b4cdb',
            borderRadius: [6, 6, 0, 0]
          }
        }],
        animationDuration: 1000,
        animationEasing: 'cubicOut'
      };

      myChart.setOption(option);

      myChart.on('click', function (params) {
        aiText.innerText = aiMap[params.name] || '暂无 AI 解读';
        aiBox.classList.remove('active');
        void aiBox.offsetWidth;
        aiBox.classList.add('active');
      });
    })
    .catch(err => {
      aiText.innerText = '⚠️ 数据加载失败，请检查 JSON 文件路径';
      console.error(err);
    });

  window.addEventListener('resize', () => {
    myChart.resize();
  });
</script>

</body>
</html>
